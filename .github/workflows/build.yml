name: Build Axiom Mod DLL

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('AxiomBuilder/xmake.lua') }}

      - name: Update repos
        working-directory: AxiomBuilder
        run: xmake repo -u

      - name: Configure
        working-directory: AxiomBuilder
        run: xmake f -a x64 -m release -p windows -v -y

      - name: Compile
        working-directory: AxiomBuilder
        run: xmake -y -v

      - name: Upload Compiled DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxiomBuilder-DLL
          path: AxiomBuilder/bin/AxiomBuilder/
