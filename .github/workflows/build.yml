name: Build Axiom Mod DLL

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure and Compile
        run: |
          cd AxiomBuilder
          xmake repo --add liteldev-repo https://github.com/LiteLDev/xmake-repo.git
          xmake repo -u
          xmake f -m release -y
          xmake -v -y

      - name: Upload Compiled DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxiomBuilder-DLL
          path: AxiomBuilder/build/windows/x64/release/*.dll
